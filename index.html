<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1e1e2e">
<title>Drzewo mamy — Domianowie, Myślakowie, Miecznikowscy</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("aa_theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#eff1f5" : "#1e1e2e";
  })();
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="drzewo-mama" class="tree-page">
<div class="wrap">
<div id="chrome"></div>
<main id="main">
<h1 class="sr">Drzewo mamy: Domianowie, Myślakowie, Miecznikowscy</h1>
<div class="tree-bar">
  <div class="seg" role="group" aria-label="Kogo pokazać">
    <button class="chip" type="button" data-mode="prosta" aria-pressed="false">Linia prosta</button>
    <button class="chip" type="button" data-mode="rodzenstwo" aria-pressed="false">Z rodzeństwem</button>
    <button class="chip" type="button" data-mode="wszyscy" aria-pressed="false">Wszyscy</button>
  </div>
  <label class="search"><span class="sr">Znajdź osobę</span><input id="szukaj" type="search" list="osoby-list" placeholder="Znajdź osobę…" autocomplete="off"></label>
  <datalist id="osoby-list"></datalist>
  <span class="muted small" id="asof"></span>
  <div class="legend" aria-label="Legenda">
    <span><i class="mark ok"></i>pewne</span><span><i class="mark prawd"></i>prawdopodobne</span><span><i class="mark hyp"></i>hipoteza</span>
    <span class="lk"><i class="mark link-axis"></i>linia prosta</span><span class="lk"><i class="mark link-prawd"></i>powiązanie prawdopodobne</span><span class="lk"><i class="mark link-hyp"></i>powiązanie hipotetyczne</span>
  </div>
</div>
<div class="stage" id="stage">
  <svg id="tree" role="application" aria-label="Drzewo rodziny. Przeciągnij, aby przesunąć; kółko lub dwa palce, aby przybliżyć.">
    <g id="vp"><g id="edges" class="edges"></g><g id="nodes"></g></g>
  </svg>
  <div class="ruler" id="ruler" aria-hidden="true"></div>
  <div class="zoom" role="group" aria-label="Widok">
    <button type="button" id="zin" aria-label="Przybliż">+</button>
    <button type="button" id="zout" aria-label="Oddal">−</button>
    <button type="button" id="zfit" class="fit" aria-label="Pokaż całe drzewo">całe</button>
    <button type="button" id="zhome" class="fit" aria-label="Wróć do linii prostej">oś</button>
  </div>
  <aside class="panel" id="panel" hidden aria-label="Osoba"></aside>
</div>
</main>
</div>
<script src="data/mama.js"></script>
<script src="assets/app.js"></script>
<script src="assets/tree.js"></script>
</body>
</html>
