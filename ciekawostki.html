<script>
  (function () {
    var t;
    try { t = localStorage.getItem("aa_theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#eff1f5" : "#1e1e2e";
  })();
</script>
<link rel="stylesheet" href="assets/style.css">
</head>

  <p class="lead">Historie z okolic Szczytna, Kurpi i północnego Mazowsza, związane z miejscami i latami życia przodków. Każda ma źródło i oznaczenie: fakt o rodzinie, kontekst albo hipoteza.</p>
</section>
